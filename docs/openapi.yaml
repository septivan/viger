openapi: 3.1.0
info:
  title: Viger API
  version: 1.0.0
  description: REST API for browsing games and publishing player reviews. The WebSocket event contract is documented under `x-websocket-events`.
  license:
    name: MIT
    identifier: MIT
security: []
servers:
  - url: http://localhost:8080
    description: Local Docker deployment
tags:
  - name: Health
    description: Container liveness, readiness, and operational visibility.
  - name: Games
    description: Public game catalog discovery and details.
  - name: Reviews
    description: Public game reviews and live review notifications.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the API process is running
      responses:
        "200":
          description: The process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the game catalog can be read
      responses:
        "200":
          description: The API is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Search, filter, sort, and page the game catalog
      parameters:
        - name: q
          in: query
          description: Case-insensitive title search
          schema:
            type: string
            maxLength: 100
        - name: genre
          in: query
          schema:
            type: string
        - name: platform
          in: query
          schema:
            type: string
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
            default: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [rating_desc, reviews_desc, title_asc, newest]
            default: rating_desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/GamePageSize"
      responses:
        "200":
          description: A page of games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/games/{gameID}:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [Games]
      operationId: getGame
      summary: Read game details and current rating aggregates
      responses:
        "200":
          description: Game details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /v1/games/{gameID}/reviews:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [Reviews]
      operationId: listGameReviews
      summary: Sort and page reviews for a game
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, rating_desc, rating_asc]
            default: newest
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ReviewPageSize"
      responses:
        "200":
          description: A page of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/GameNotFound"
    post:
      tags: [Reviews]
      operationId: createGameReview
      summary: Validate and publish a review for a game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReview"
      responses:
        "201":
          description: The review was created and a `review.created` event was broadcast
          headers:
            Location:
              description: Logical URL of the created review
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/GameNotFound"
        "415":
          description: The request is not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: One or more review fields violate domain validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: The client exceeded the review write rate
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/ws:
    get:
      tags: [Reviews]
      operationId: connectReviewEvents
      summary: Upgrade to the review notification WebSocket
      description: Requires an Origin allowed by backend configuration. This operation upgrades the HTTP connection and does not return a normal JSON response.
      responses:
        "101":
          description: WebSocket connection established
        "403":
          description: Origin is not allowed
        "503":
          description: WebSocket connection limit reached
x-websocket-events:
  review.created:
    direction: server-to-client
    description: Sent after a review is validated and committed to memory.
    payload:
      $ref: "#/components/schemas/ReviewCreatedEvent"
components:
  parameters:
    GameID:
      name: gameID
      in: path
      required: true
      schema:
        type: string
        pattern: ^game-[0-9]{3}$
      example: game-002
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    GamePageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    ReviewPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  responses:
    BadRequest:
      description: Query or JSON input is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GameNotFound:
      description: The game does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: The API is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Game:
      type: object
      required: [id, title, description, genre, platforms, developer, releaseDate, averageRating, reviewCount, ratingDistribution]
      properties:
        id:
          type: string
          example: game-002
        title:
          type: string
          example: Hades
        description:
          type: string
        genre:
          type: string
          example: Roguelike
        platforms:
          type: array
          minItems: 1
          items:
            type: string
        developer:
          type: string
          example: Supergiant Games
        releaseDate:
          type: string
          format: date
        averageRating:
          type: number
          minimum: 0
          maximum: 5
        reviewCount:
          type: integer
          minimum: 0
        ratingDistribution:
          type: object
          required: ["1", "2", "3", "4", "5"]
          properties:
            "1":
              type: integer
              minimum: 0
            "2":
              type: integer
              minimum: 0
            "3":
              type: integer
              minimum: 0
            "4":
              type: integer
              minimum: 0
            "5":
              type: integer
              minimum: 0
          additionalProperties: false
    Review:
      type: object
      required: [id, gameId, reviewerName, rating, text, createdAt]
      properties:
        id:
          type: string
        gameId:
          type: string
        reviewerName:
          type: string
          minLength: 2
          maxLength: 80
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          minLength: 10
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
    CreateReview:
      type: object
      additionalProperties: false
      required: [reviewerName, rating, text]
      properties:
        reviewerName:
          type: string
          minLength: 2
          maxLength: 80
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          minLength: 10
          maxLength: 2000
    GamePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Game"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ReviewPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ReviewCreatedEvent:
      type: object
      required: [type, gameId, review]
      properties:
        type:
          type: string
          const: review.created
        gameId:
          type: string
        review:
          $ref: "#/components/schemas/Review"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            requestId:
              type: string
