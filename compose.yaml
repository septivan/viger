name: viger

x-runtime-hardening: &runtime-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  backend:
    <<: *runtime-hardening
    build:
      context: ./backend
    environment:
      VIGER_HTTP_ADDRESS: :8080
      VIGER_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VIGER_REVIEW_RATE_LIMIT: "10"
      VIGER_MAX_WS_CONNECTIONS: "500"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    mem_limit: 256m
    networks: [viger]

  frontend:
    <<: *runtime-hardening
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/v1/ws
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 384m
    networks: [viger]

networks:
  viger:
